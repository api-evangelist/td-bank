openapi: 3.2.0
info:
  title: TD Bank Apps Management Clusters API
  description: Apps Management API v2.0. Lets data recipients create and update fintech apps on the TD/Akoya network, list purchased FDX data clusters, manage subscriptions, and look up which entities support specific FDX clusters.
  version: 2.0.0
  contact:
    name: TD Open Banking Developer Support
    url: https://developer.td.com
servers:
- url: https://api.openbanking.amcb.developer.td.com/apps/v2
  description: Production
security:
- serviceToken: []
tags:
- name: Clusters
paths:
  /apps/{appId}/clusters:
    get:
      operationId: listAppClusters
      summary: List Purchased FDX Clusters
      tags:
      - Clusters
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: FDX clusters list
  /clusters/{clusterId}/entities:
    get:
      operationId: listClusterEntities
      summary: List Entities Supporting Cluster
      tags:
      - Clusters
      parameters:
      - name: clusterId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Entities
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: Apps Management API v2 Guide
  url: https://docs.pat.openbanking.amcb.developer.td.com/reference/management-api-v20-guide
