- aid: td-bank:notifications-api
  name: TD Bank Notifications API
  description: >-
    Notifications API — retrieves alerts about significant changes on the TD/Akoya network, including
    planned/unplanned maintenance outages and consent events (revoked or modified consumer consents).
    Lets data recipients react to consent revocations and platform incidents in near real time.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
